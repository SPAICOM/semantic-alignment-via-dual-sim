# @package _global_.alignment
# Prototype-based Parseval Frame Equalization (zero-shot alignment) for classification.

type: PPFE
n_clusters: 20   # number of KMeans clusters
n_proto: 1000    # prototypes sampled per cluster
# Where KMeans runs: pilots = the RX pilots (all results so far);
# train_tx = the whole TX training latent space, the RX builds its prototypes
# from its own embeddings of the same samples with the TX's sample → cluster map.
cluster_on: pilots
lr_tx: 0.03      # optimal joint LR (tuned via joint_lr_search)
lr_rx: 0.07      # optimal joint LR (tuned via joint_lr_search)
