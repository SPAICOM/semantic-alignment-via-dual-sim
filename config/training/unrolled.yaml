defaults:
  - base
  - coupling: diagonal # conv | conv2d | diagonal | scalar

# Number of unrolled gradient layers (inference iterations)
K: 10

# Learning rate for the classic-comparison Adam loop
lr: 0.1
lr_tx: 0.1
lr_rx: 0.2

# Training hyper-params
batch_size: 16
epochs: 100
lr_schedule: cosine  # none | cosine
grad_clip: 1.0

# Random MIMO channel dataset
n_channels: 1000
train_ratio: 0.7
val_ratio: 0.15

# Wandb logging
wandb_project: compare_unrolled

# Unrolled step-size init and momentum
init_w: 0.1
init_mu: 0.9

# Innovation normalisation: rms | unit | sign | none
innovation_norm: rms

# How the descent direction is computed: autograd | analytic
innovation_mode: autograd

# Deep supervision: 'all' averages per-layer NMSE across all K steps; 'final' uses only the last.
supervision: all      # 'final': only last step NMSE | 'all': weighted sum over all K steps
weight_ratio: 1.0     # w[0]/w[K-1]: ratio of first-layer to last-layer loss weight (only used when supervision=all)
                      # 1.0=uniform; 0.0=last-layer only; 0.2 ≈ gamma=0.946 for K=30

# Mixed-precision training: use bfloat16 (saves ~50% memory, needs Ampere+ GPU)
bf16: true

# Adam-style momentum on the innovation
momentum: true

# Learnable phase momentum S: phi^{k+1} = s * phi^k + w * g^k
# When enabled, s is a learnable vector (1 x n_phases) initialised to 1,
# shared across all K layers.
learn_S: true
reg_S: 0.01

# Seeds used for the classic Adam baseline (different random channels -> averaged curve)
classic_seeds:
  - 27
  - 42
  - 100
  - 123
  - 144
  - 200
