# Optimiser and scheduler settings for the alternating SIM optimisation
# clf_type: linear | neural
clf_type: linear

max_iters: 3000
lr: 0.1
seed: 42

# Optimizer: sgd | adam (default)
optimizer: adam

# LR scheduler: none (default) | cosine (constant LR for warmup_frac iters, then cosine → lr*1e-3)
scheduler: none
warmup_frac: 0.05   # fraction of max_iters at constant LR before cosine decay (scheduler=cosine only)

# Gradient clipping and alternating steps (dual SIM only)
clip_value: 1.0
rx_steps_per_tx: 2

# GPU index to use (null = let PyTorch pick, integer = sets CUDA_VISIBLE_DEVICES)
gpu: null
