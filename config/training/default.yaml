# Optimiser and scheduler settings for the alternating SIM optimisation
# clf_type: linear | neural
clf_type: linear

max_iters: 3000
lr: 0.1
seed: 42

# Adam hyperparameters
warmup_frac: 0.05
clip_value: 1.0
rx_steps_per_tx: 2
patience: 500

# LR scheduler: cosine annealing with linear warmup (warmup_frac of max_iters)
# Set to true to enable; false = constant LR (Adam default)
use_scheduler: false
