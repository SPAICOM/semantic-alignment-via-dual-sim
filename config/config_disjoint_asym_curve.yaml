defaults:
  - sim: disjoint_asym
  - alignment: ppfe
  - datasets/classification: cifar10
  - data: default
  - training: disjoint
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: disjoint_asym_curve
  result_subdir: disjoint_asym_curve

training:
  save_curve: true
  max_iters: 200   # 200 cycles (1 TX step + 1 RX step per cycle)

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment: linear,ppfe
      training.seed: 27,42,100,123,144,200
