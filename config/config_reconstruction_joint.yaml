# Joint Dual-SIM reconstruction — final setup: MMD-InfoVAE autoencoder pair
# (base_mmd1 → small_mmd1), L=50, 64x64 meta-atoms, channel_dim=128 (the maximum),
# noiseless (snr=null), seed 42, cosine lr schedule, lr 0.03 on both TX and RX
# (best of the joint cosine lr search: 0.01/0.03/0.05/0.1) — one job per strategy.
# Dataset defaults to MNIST (rec-all runs MNIST, Fashion-MNIST and CIFAR-10).
# Results: results/reconstruction/joint/ (Parquet + PNG grid + .pt link per strategy).
defaults:
  - sim: joint
  - alignment/reconstruction: ppfe
  - datasets/reconstruction: mnist
  - reconstruction: default
  - training: joint
  - _self_

sim:
  L: 50
  M_int: 64
  channel_dim: 128   # largest possible: min(TX, RX) complex latent dims of the AE pair (128 for small_*)
  snr: null
  name: joint
  result_subdir: joint

# Overrides the per-strategy lr of alignment/reconstruction (tuned for L=25, constant lr).
alignment:
  lr_tx: 0.03
  lr_rx: 0.03

reconstruction:
  tx_variant: base_mmd1
  tx_seed: 42
  rx_variant: small_mmd1
  rx_seed: 42

training:
  seed: 42
  scheduler: cosine
  # max_iters counts alternating cycles (k_T + k_R steps each): 150 × 200 =
  # 30000 Adam steps.
  max_iters: 150
  k_T: 100
  k_R: 100

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment/reconstruction: linear,ppfe
