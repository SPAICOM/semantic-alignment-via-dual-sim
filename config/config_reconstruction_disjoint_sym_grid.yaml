# Grid search for disjoint sym (constructive) reconstruction: Adam lr × LR scheduler × L,
# on top of config_reconstruction_disjoint_sym_constructive (MNIST, base_mmd1 → small_mmd1,
# 64x64, channel_dim=128, noiseless, 3000 steps). Linear alignment only.
# TX and RX share one lr (`lr`); their losses are independent, so the per-side best lr
# can still be read from loss_history / rx_loss_history.
# Each (lr, scheduler) point gets its own subdir (the filename already carries L, M):
# results/reconstruction/disjoint_sym_grid/lr{lr}_{scheduler}/constructive/
defaults:
  - config_reconstruction_disjoint_sym_constructive
  - override alignment/reconstruction: linear
  - _self_

lr: 0.1

alignment:
  lr_tx: ${lr}   # alignment lr_tx/lr_rx take precedence over training.*
  lr_rx: ${lr}

sim:
  name: disjoint_sym_grid
  result_subdir: disjoint_sym_grid/lr${lr}_${training.scheduler}

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment/reconstruction: linear
      lr: 0.01,0.03,0.1,0.3,1.0
      training.scheduler: null,cosine
      sim.L: 25,50
