defaults:
  - sim: disjoint_asym
  - alignment: ppfe
  - datasets: cifar10
  - data: default
  - training: unrolled
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  name: compare_unrolled_disjoint_asym
  result_subdir: compare_unrolled_disjoint_asym
  init_mode: random
  constructive: false
  alignment_side: tx
  epsilon: 0.0

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment: linear,ppfe
