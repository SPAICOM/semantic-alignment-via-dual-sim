defaults:
  - sim: disjoint_sym
  - alignment: ppfe
  - datasets/classification: cifar10
  - data: default
  - training: unrolled
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: compare_unrolled_disjoint_sym
  result_subdir: compare_unrolled_disjoint_sym
  init_mode: random
  constructive: false
  epsilon: 0.0

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment: linear,ppfe
