# @package _global_.datasets
# Fashion-MNIST — raw images for image-reconstruction alignment.
# Unlike config/datasets/classification/fashion_mnist.yaml (Semasia embedding collection,
# classification), this points at the original HF dataset so ground-truth pixels
# are available for decoding / reconstruction-quality metrics (MSE, PSNR, SSIM).
# Parquet shards live at hf://datasets/{hf_repo}/{hf_config}/{split}-*.parquet

name: fashion_mnist  # keys models/autoencoders/{name}/ and result filenames
hf_repo: zalando-datasets/fashion_mnist
hf_config: fashion_mnist
image_col: image
label_col: label
train_split: train
test_split: test
image_size: [28, 28]
channels: 1
num_classes: 10
