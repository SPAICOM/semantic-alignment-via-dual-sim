defaults:
  - sim: joint
  - alignment/classification: ppfe
  - datasets/classification: cifar10
  - datasets/channel: default
  - data: default
  - training: unrolled
  - warmstart: none
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: unrolled_joint
  result_subdir: unrolled_joint
  init_mode: random

channel_dm:
  h0_var: null

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      warmstart: none,only_semantic
      training.full_oracle: false,true
      training.warm_adam_baseline: false,true
      channel_dm.h0_var: 0,0.1,1,null
