defaults:
  - sim: disjoint_4sim
  - alignment: ppfe
  - datasets: cifar10
  - data: default
  - training: disjoint
  - classifier: default
  - _self_

sim:
  name: channel_dim_disjoint_4sim
  result_subdir: disjoint_4sim_channel_dim
  L: 10

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # For Linear, channel_dim must be <= min(K_tx, K_rx) = 192 — 384 will raise ValueError.
      sim.channel_dim: 1,2,4,6,8,10,20,192,384
      alignment: linear,ppfe
      training.seed: 27,42,100
