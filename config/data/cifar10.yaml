# CIFAR-10 dataset with ViT-Small (TX) and ViT-Base (RX) encoders

name: cifar10
tx_enc: vit_small_patch16_224
rx_enc: vit_base_patch16_224

train_label_size: 4200    # semantic pilots per class
method: centroid          # pilot selection: centroid | random
grouping: label           # grouping for selection: label | proto
batch_size: 128
num_workers: 0
