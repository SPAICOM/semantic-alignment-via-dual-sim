# Mono-SIM TX (constructive) reconstruction — final setup: MMD-InfoVAE autoencoder pair
# (base_mmd1 → small_mmd1), L=50, 64x64 meta-atoms, noiseless (snr=null), seed 42,
# cosine lr schedule, lr 0.1 (best of the lr × scheduler × L grid search) — one job per
# strategy (Linear, PPFE).
# Dataset defaults to MNIST (rec-all runs MNIST, Fashion-MNIST and CIFAR-10).
# Results: results/reconstruction/mono/constructive/tx/ (Parquet + PNG grid + .pt link).
defaults:
  - sim: mono
  - alignment/reconstruction: ppfe
  - datasets/reconstruction: mnist
  - reconstruction: default
  - training: mono
  - _self_

sim:
  constructive: true
  L: 50
  M_int: 64
  snr: null

reconstruction:
  tx_variant: base_mmd1
  tx_seed: 42
  rx_variant: small_mmd1
  rx_seed: 42

training:
  seed: 42
  lr: 0.1
  scheduler: cosine

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment/reconstruction: linear,ppfe
