defaults:
  - sim: joint
  - alignment: ppfe
  - datasets/classification: cifar10
  - datasets/channel: default
  - data: default
  - training: unrolled
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: compare_unrolled_joint
  result_subdir: compare_unrolled_joint
  init_mode: random

training:
  epochs: 200
  lr_schedule: none
  weight_ratio: 1.0
  training_type: independent

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      channel_dm.h0_var: 1,0.5,0,~
      training.warm_start_type: only_semantic,average
