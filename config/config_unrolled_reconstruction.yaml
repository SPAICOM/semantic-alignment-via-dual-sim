# Deep unrolling for image reconstruction — the reconstruction analogue of
# config_unrolled_joint.yaml. Same sim/, training/unrolled, warmstart/ and
# datasets/channel groups; the downstream metric is the RX decoder's PSNR / MSE
# (results/reconstruction/unrolled/). Swap the strategy with
# alignment/reconstruction=linear, the AE pair via reconstruction.{tx,rx}_{variant,seed}.
defaults:
  - sim: joint
  - alignment/reconstruction: ppfe
  - datasets/reconstruction: cifar10
  - datasets/channel: default
  - reconstruction: default
  - training: unrolled
  - warmstart: only_semantic
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: unrolled_joint
  result_subdir: unrolled_joint
  init_mode: random

reconstruction:
  # Test images decoded per test channel and unrolled step (null = the whole test split).
  unrolled_eval_images: 500

training:
  wandb_project: unrolled_reconstruction

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      warmstart: none,only_semantic,average
      channel_dm.h0_var: null,1,0.1,0
