defaults:
  - sim: joint
  - alignment/classification: ppfe
  - datasets/classification: cifar10
  - data: default
  - training: joint
  - classifier: default
  - _self_

sim:
  L: 10
  M_int: 32
  channel_dim: 20
  name: joint_curve
  result_subdir: joint_curve

training:
  save_curve: true
  max_iters: 200   # 200 alternating cycles (each = 100 TX + 100 RX steps)

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      alignment/classification: linear,ppfe
      training.seed: 27,42,100,123,144,200
