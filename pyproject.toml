[project]
name = "semantic-alignment-via-dual-sim"
version = "0.1.0"
description = "Semantic Alignment via Dual Stacked Intelligent Metasurfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "polars>=1.0.0",
    "huggingface-hub>=0.23.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "hydra-core>=1.3.2",
    "wandb>=0.25.0",
    "lightning>=2.0.0",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_alignment"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
